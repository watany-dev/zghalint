name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@a45da26e596797833bbed34ebfde3c291b18e02e # v2.0.1
        with:
          version: 0.15.0
      - run: zig fmt --check src/ build.zig

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@a45da26e596797833bbed34ebfde3c291b18e02e # v2.0.1
        with:
          version: 0.15.0
      - run: zig build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@a45da26e596797833bbed34ebfde3c291b18e02e # v2.0.1
        with:
          version: 0.15.0
      - run: zig build test --summary all
