name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - run: zig fmt --check src/ build.zig

  lint:
    name: Lint (shell / workflows / python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # shellcheck ships on the GitHub-hosted runners; actionlint and zizmor
      # do not.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          # Pin the archive so a compromised release cannot silently replace
          # the linter that guards these workflows.
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Install zizmor and ruff
        run: pip install -r .github/lint-requirements.txt

      # `action.yml` carries a `# shellcheck disable=SC2086` directive, and the
      # composite action is what every consumer of this repository runs. Its
      # embedded scripts are checked directly; actionlint covers the ones in
      # .github/workflows/.
      - name: shellcheck (scripts/ and action.yml)
        run: |
          shellcheck scripts/*.sh
          ./scripts/shellcheck-action.sh action.yml

      # actionlint shells out to shellcheck for every `run:` block.
      - name: actionlint
        run: actionlint -color

      # zizmor overlaps zghalint's own SEC/SC rules; running it here is both a
      # third-party check of these workflows and a source of parity data.
      - name: zizmor
        run: zizmor --offline --format plain .github/workflows action.yml

      - name: ruff
        run: |
          ruff check tests/pbt/
          ruff format --check tests/pbt/

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        # macOS は macos-15 に固定する。macos-latest が載せる新しい SDK では
        # Zig 0.15.2 のリンカが libSystem のシンボル（_abort,
        # __availability_version_check 等）を解決できずビルドが落ちる。
        # Zig 側が対応したらここを macos-latest に戻す。
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - run: zig build

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - run: zig build test --summary all

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      # 決定的な回帰実行。シードコーパスを 1 件ずつ流すだけなので数秒で終わり、
      # 過去に見つかった入力が再発していれば必ず落ちる。
      - name: Fuzz targets over the seed corpus
        run: zig build fuzz
      # 探索実行。`--fuzz` は Web UI を立てて常駐するモードなので timeout で
      # 打ち切る。時間切れ (124) が「所定時間内に反例なし」を意味し、失敗は
      # ログに現れる。CI を不安定にしないため探索側は 5 分に制限する。
      - name: Continuous fuzzing (time-limited)
        run: |
          set -uo pipefail
          timeout --signal=INT 300 zig build fuzz --fuzz --webui=127.0.0.1 > fuzz.log 2>&1
          status=$?
          cat fuzz.log
          if [ "$status" -ne 124 ]; then
            echo "::error::fuzzing stopped before the time limit (exit ${status})"
            exit 1
          fi
          if grep -qiE "panic|segmentation fault|run test failure|tests failed" fuzz.log; then
            echo "::error::a fuzz target failed; reproduce with 'zig build fuzz --fuzz'"
            exit 1
          fi
      - name: Upload fuzz log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-log
          path: fuzz.log

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      # ubuntu-24.04 (noble) には kcov パッケージが存在しないため
      # (`E: Unable to locate package kcov`)、v43 をソースからビルドする。
      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libcurl4-openssl-dev libdw-dev libelf-dev
          git clone --depth 1 --branch v43 https://github.com/SimonKagstrom/kcov.git /tmp/kcov
          mkdir /tmp/kcov/build && cd /tmp/kcov/build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j"$(nproc)"
          sudo make install
      - name: Build test binary
        run: zig build test-bin
      - name: Run coverage measurement
        run: |
          kcov --include-path=src/ --exclude-path=src/main.zig \
            coverage/ \
            "$(find zig-out/bin/ -type f -executable | head -1)"
      - name: Check coverage threshold (95%)
        run: |
          JSON=$(find coverage/ -maxdepth 2 -name "coverage.json" | head -1)
          if [ -z "$JSON" ]; then
            echo "::error::coverage.json not found"
            find coverage/ -type f || true
            exit 1
          fi
          COVERED=$(jq -r '.percent_covered' "$JSON")
          echo "Coverage: ${COVERED}%"
          if [ "$(echo "$COVERED < 95" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERED}% is below 95% threshold"
            exit 1
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/

  pbt:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - run: zig build
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r tests/pbt/requirements.txt
      - run: pytest tests/pbt/ -x -v
