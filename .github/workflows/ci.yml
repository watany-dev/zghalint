name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - run: zig fmt --check src/ build.zig

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - run: zig build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - run: zig build test --summary all

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libcurl4-openssl-dev libdw-dev libelf-dev
          git clone --depth 1 --branch v43 https://github.com/SimonKagstrom/kcov.git /tmp/kcov
          mkdir /tmp/kcov/build && cd /tmp/kcov/build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j$(nproc)
          sudo make install
      - name: Build test binary
        run: zig build test-bin
      - name: Run coverage measurement
        run: |
          kcov --include-path=src/ --exclude-path=src/main.zig \
            coverage/ \
            $(find zig-out/bin/ -type f -executable | head -1)
      - name: Check coverage threshold (95%)
        run: |
          JSON=$(find coverage/ -name "coverage.json" -path "*/zig-out/*" | head -1)
          COVERED=$(jq -r '.percent_covered' "$JSON")
          echo "Coverage: ${COVERED}%"
          if [ "$(echo "$COVERED < 95" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERED}% is below 95% threshold"
            exit 1
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
