name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # マージキューを有効化した瞬間に検証が抜けないよう、先に足しておく。
  merge_group:
  # ランナー障害などの一時的な失敗を、空コミットなしで再実行できるようにする。
  workflow_dispatch:

permissions:
  contents: read

# 連続 push で古い run を積み上げない (BP005)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Check formatting
        run: zig fmt --check src/ build.zig

  lint:
    name: Lint (shell / workflows / python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/lint-requirements.txt

      # shellcheck ships on the GitHub-hosted runners; actionlint and zizmor
      # do not.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          # Pin the archive so a compromised release cannot silently replace
          # the linter that guards these workflows.
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Install zizmor and ruff
        run: pip install -r .github/lint-requirements.txt

      # `action.yml` carries a `# shellcheck disable=SC2086` directive, and the
      # composite action is what every consumer of this repository runs. Its
      # embedded scripts are checked directly; actionlint covers the ones in
      # .github/workflows/.
      - name: shellcheck (scripts/ and action.yml)
        run: |
          shellcheck scripts/*.sh
          ./scripts/shellcheck-action.sh action.yml

      # The release version is written out in places that cannot read
      # build.zig.zon at build time (action.yml's download fallback, the README
      # examples). Catching the drift on every PR keeps a release from shipping
      # an action that downloads the previous version.
      - name: Version references in sync
        run: ./scripts/check-version-sync.sh

      # actionlint shells out to shellcheck for every `run:` block.
      - name: actionlint
        run: actionlint -color

      # zizmor overlaps zghalint's own SEC/SC rules; running it here is both a
      # third-party check of these workflows and a source of parity data.
      - name: zizmor
        run: zizmor --offline --format plain .github/workflows action.yml

      - name: ruff
        run: |
          ruff check tests/pbt/ scripts/
          ruff format --check tests/pbt/ scripts/

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        # macOS は macos-15 に固定する。macos-latest が載せる新しい SDK では
        # Zig 0.15.2 のリンカが libSystem のシンボル（_abort,
        # __availability_version_check 等）を解決できずビルドが落ちる。
        # Zig 側が対応したらここと release.yml の build マトリクスを併せて
        # macos-latest に戻す。
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Build
        run: zig build

  cross:
    name: Cross-compile ${{ matrix.zig_target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        # release.yml の build マトリクスと同じ配布ターゲット。Zig は遅延解析な
        # ので、あるターゲットでしか通らない分岐はそのターゲットでコンパイルする
        # まで落ちない。タグ push まで気付けないのを避けるため PR でも回す。
        # ターゲットを増減するときは release.yml も併せて更新すること。
        zig_target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Build ${{ matrix.zig_target }}
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        # 3 OS × Debug で OS 分岐（ファイルモード・改行コード）の実行時挙動を
        # 押さえ、ReleaseFast を 1 本だけ足して safety check の無い配布形態の
        # UB を拾う。aarch64 は安価な ubuntu-24.04-arm の Debug のみ。
        # macos-15 の固定理由は build ジョブのコメントを参照。
        include:
          - os: ubuntu-latest
            optimize: Debug
          - os: ubuntu-24.04-arm
            optimize: Debug
          - os: macos-15
            optimize: Debug
          - os: windows-latest
            optimize: Debug
          - os: ubuntu-latest
            optimize: ReleaseFast
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Run unit tests
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

  action-smoke:
    name: Action Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        # macos-15 の固定理由は build ジョブのコメントを参照。
        include:
          - os: ubuntu-latest
            exe: ''
          - os: macos-15
            exe: ''
          - os: windows-latest
            exe: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Build
        run: zig build
      # action は `binary` 入力で自前ビルドを指す。リリース資産のダウンロード
      # 経路は PR 時点では検証できないので、ここで見るのは引数の組み立て・
      # グロブ展開・入力の対応付けだけ。
      - name: Stage the smoke workspace
        shell: bash
        run: |
          mkdir -p smoke/workflows
          cp tests/fixtures/e2e/clean.yml smoke/workflows/clean.yml
          cat > smoke/workflows/fixable.yml <<'EOF'
          name: fixable
          on:
            push:
              branches: [main]
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false
          EOF
          cat > smoke/no-bp001.yml <<'EOF'
          rules:
            BP001:
              enabled: false
          EOF
      # 終了コード 0 は「引数が受理され、error 深刻度の指摘が無い」こと。
      # 未知のフラグや値は CLI が終了コード 2 で拒否するので、各 format /
      # offline の対応付けはこの 3 ステップで確認できる。
      - name: Run action (terminal, glob over two files)
        uses: ./
        with:
          binary: zig-out/bin/zghalint${{ matrix.exe }}
          paths: 'smoke/workflows/*.yml'
          offline: 'true'
      - name: Run action (json)
        uses: ./
        with:
          binary: zig-out/bin/zghalint${{ matrix.exe }}
          paths: 'smoke/workflows/*.yml'
          format: json
          offline: 'true'
      - name: Run action (sarif)
        uses: ./
        with:
          binary: zig-out/bin/zghalint${{ matrix.exe }}
          paths: 'smoke/workflows/*.yml'
          format: sarif
          offline: 'true'
      - name: Run action (fix with a config that disables BP001)
        uses: ./
        with:
          binary: zig-out/bin/zghalint${{ matrix.exe }}
          paths: 'smoke/workflows/fixable.yml'
          config: smoke/no-bp001.yml
          offline: 'true'
          fix: safe
      - name: Assert the disabled rule was not fixed
        shell: bash
        run: |
          if grep -q 'timeout-minutes' smoke/workflows/fixable.yml; then
            echo "::error::--config was not honored: BP001 was fixed while disabled"
            exit 1
          fi
      - name: Run action (fix safe)
        uses: ./
        with:
          binary: zig-out/bin/zghalint${{ matrix.exe }}
          paths: 'smoke/workflows/fixable.yml'
          offline: 'true'
          fix: safe
      - name: Assert the safe fix was applied
        shell: bash
        run: |
          if ! grep -q 'timeout-minutes' smoke/workflows/fixable.yml; then
            echo "::error::--fix did not rewrite the workflow"
            cat smoke/workflows/fixable.yml
            exit 1
          fi
      # nullglob が効いていれば、マッチしない .yaml パターンは引数から消え、
      # clean.yml だけが渡って終了コード 0。効いていなければパターンが literal
      # で渡り、存在しないファイルとして終了コード 2 になる。常にマッチする
      # clean.yml を併記するのは、引数が空になって CLI 既定の .github/workflows
      # 探索に落ち、この判定がリポジトリ自身の指摘内容に左右されるのを防ぐため。
      - name: Run action (glob matching nothing)
        uses: ./
        with:
          binary: zig-out/bin/zghalint${{ matrix.exe }}
          paths: 'smoke/workflows/*.yaml smoke/workflows/clean.yml'
          offline: 'true'

  self-lint:
    name: Self Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # SARIF を Code Scanning に上げるジョブだけに付与する。
      security-events: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Build
        run: zig build
      # `--offline` で回す。ネットワークルール（SC003-SC006）は GitHub API に
      # 依存し、fork からの PR やレート制限で結果が揺れるため。
      - name: Lint own workflows (SARIF)
        id: lint
        run: |
          set +e
          ./zig-out/bin/zghalint --offline --format sarif -- .github/workflows/*.yml > zghalint.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Lint own workflows (terminal)
        run: ./zig-out/bin/zghalint --offline --color always -- .github/workflows/*.yml || true
      # fork からの PR では GITHUB_TOKEN が read-only で upload-sarif が 403 に
      # なる。終了コード 2 のときは SARIF が途中で切れているため、上げると
      # パースエラーになって下の説明的なエラーが埋もれる。どちらも上げない。
      - name: Upload SARIF
        if: >-
          always()
          && steps.lint.outputs.exit_code != '2'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: zghalint.sarif
          category: zghalint
      # 終了コード 1 は error 深刻度の指摘、2 は lint できなかったファイル。
      # warning / info は Code Scanning に残すだけで CI は落とさない。
      - name: Fail on error-severity findings
        if: steps.lint.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.lint.outputs.exit_code }}
        run: |
          echo "::error::zghalint exited with $EXIT_CODE"
          exit 1

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      # 決定的な回帰実行。シードコーパスを 1 件ずつ流すだけなので数秒で終わり、
      # 過去に見つかった入力が再発していれば必ず落ちる。
      #
      # `--fuzz` の探索実行は CI に入れていない。Zig 0.15.2 のファザ本体が
      # 起動直後に落ちる (`run test failure`) ため、反例の有無に関わらず必ず
      # 赤になる。ターゲットを 1 つだけ持つ最小プロジェクトでも、キャッシュを
      # 削除した初回実行でも再現するので zghalint 側の問題ではない。
      # 詳細と手元での回し方は docs/design/pbt-strategy.md §6-4 を参照。
      - name: Fuzz targets over the seed corpus
        run: zig build fuzz

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      # ubuntu-24.04 (noble) には kcov パッケージが存在しないため
      # (`E: Unable to locate package kcov`)、v43 をソースからビルドする。
      # ビルド結果はキャッシュし、毎 run のビルドを避ける。
      - name: Cache kcov
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kcov
          key: kcov-v43-${{ runner.os }}-${{ runner.arch }}
      - name: Install kcov
        run: |
          sudo apt-get update
          if [ -x "$HOME/.cache/kcov/bin/kcov" ]; then
            # キャッシュヒット時は実行時ライブラリだけ入れれば足りる。
            sudo apt-get install -y libcurl4 libdw1 libelf1
          else
            sudo apt-get install -y cmake g++ pkg-config libcurl4-openssl-dev libdw-dev libelf-dev
            git clone --depth 1 --branch v43 https://github.com/SimonKagstrom/kcov.git /tmp/kcov
            mkdir /tmp/kcov/build && cd /tmp/kcov/build
            cmake -DCMAKE_INSTALL_PREFIX="$HOME/.cache/kcov" ..
            make -j"$(nproc)"
            make install
          fi
          echo "$HOME/.cache/kcov/bin" >> "$GITHUB_PATH"
      - name: Build test binaries
        run: zig build test-bin
      # lib テストと CLI テストの両方を計測してマージする。CLI 側を外すと
      # 引数パース・終了コード・`--fix` の書き戻しが閾値の対象から漏れる。
      - name: Run coverage measurement
        run: |
          # kcov は出力先の親ディレクトリを自分では作らない。
          mkdir -p coverage
          kcov --include-path=src/ coverage/lib zig-out/bin/cov-lib-test
          kcov --include-path=src/ coverage/exe zig-out/bin/cov-exe-test
          kcov --merge coverage/merged coverage/lib coverage/exe
      - name: Check coverage threshold (95%)
        run: |
          JSON=$(find coverage/merged -maxdepth 2 -name "coverage.json" | head -1)
          if [ -z "$JSON" ]; then
            echo "::error::coverage.json not found"
            find coverage/ -type f || true
            exit 1
          fi
          COVERED=$(jq -r '.percent_covered' "$JSON")
          echo "Coverage: ${COVERED}%"
          if [ "$(echo "$COVERED < 95" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERED}% is below 95% threshold"
            exit 1
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

  pbt:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Build
        run: zig build
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/pbt/requirements.txt
      - name: Install PBT dependencies
        run: pip install -r tests/pbt/requirements.txt
      # Hypothesis の失敗例データベースを run 間で引き継ぐ。これが無いと
      # CI が見つけた反例が次の run で再実行されない。
      - name: Cache Hypothesis example database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            hypothesis-${{ runner.os }}-
      # -x は最初の失敗で打ち切るため、複数の不変条件が同時に壊れたとき
      # 全体像が 1 run で掴めない。--maxfail=3 で数件まで見えるようにする。
      - name: Run property-based tests
        run: pytest tests/pbt/ --maxfail=3 -v
