name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# リリースは途中でキャンセルすると中途半端な成果物が残るため、
# グループ化だけ行い cancel-in-progress は付けない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # このワークフローが公開する成果物は、プルリクエストが汚染しうる
          # キャッシュから出てきてはならない (zizmor: cache-poisoning)。
          use-cache: false

      - name: Build
        run: zig build

      # タグ・build.zig.zon・バイナリの --version が食い違ったまま
      # リリースされるのを防ぐ。build.zig 経由のバージョン伝播もここで検証する。
      - name: Verify version consistency
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG#v}

          ZON_VERSION=$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon | head -1)
          if [ -z "$ZON_VERSION" ]; then
            echo "::error::could not read .version from build.zig.zon"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$ZON_VERSION" ]; then
            echo "::error::tag $TAG implies version $TAG_VERSION but build.zig.zon has $ZON_VERSION"
            exit 1
          fi

          # 出力は `zghalint vX.Y.Z` 形式なので、先頭の `v` を落として比較する。
          BIN_VERSION=$(./zig-out/bin/zghalint --version | tr -d '\r' | awk '{print $NF}')
          BIN_VERSION=${BIN_VERSION#v}
          if [ "$BIN_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::binary reports --version $BIN_VERSION but tag implies $TAG_VERSION"
            exit 1
          fi
          echo "version OK: $TAG_VERSION"

      - name: Format Check
        run: zig fmt --check src/ build.zig

      - name: Test
        run: zig build test --summary all

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        # ci.yml の cross ジョブが同じ zig_target を PR 時に検証している。
        # ターゲットを増減するときは両方を併せて更新すること。
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            zig_target: x86_64-linux
            native: true
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            zig_target: aarch64-linux
            native: true
          # macOS は macos-15 に固定する。macos-latest が載せる新しい SDK では
          # Zig 0.15.2 のリンカが libSystem のシンボルを解決できずビルドが落ちる
          # （詳細は ci.yml の build ジョブのコメント）。Zig 側が対応したら
          # ci.yml と併せて macos-latest に戻す。
          #
          # macOS ランナーは arm64 であり、x86_64 バイナリの実行には Rosetta が
          # 要る。存在は保証されないため起動テストの対象外とする。
          - target: macos-x86_64
            os: macos-15
            zig_target: x86_64-macos
            native: false
          - target: macos-aarch64
            os: macos-15
            zig_target: aarch64-macos
            native: true
          - target: windows-x86_64
            os: windows-latest
            zig_target: x86_64-windows
            native: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # このワークフローが公開する成果物は、プルリクエストが汚染しうる
          # キャッシュから出てきてはならない (zizmor: cache-poisoning)。
          use-cache: false

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}

      # 起動すらしないバイナリを公開しないための最低限の確認。`--version` は
      # タグと一致していなければならない (build.zig.zon の version 更新漏れ検知)。
      - name: Smoke test binary (Unix)
        if: matrix.native && matrix.os != 'windows-latest'
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ACTUAL=$(./zig-out/bin/zghalint --version)
          echo "$ACTUAL"
          if [ "$ACTUAL" != "zghalint $TAG" ]; then
            echo "::error::--version returned '$ACTUAL', expected 'zghalint $TAG'"
            exit 1
          fi
          ./zig-out/bin/zghalint --help > /dev/null

      - name: Smoke test binary (Windows)
        if: matrix.native && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $actual = & ./zig-out/bin/zghalint.exe --version
          Write-Host $actual
          if ($actual -ne "zghalint $tag") {
            Write-Output "::error::--version returned '$actual', expected 'zghalint $tag'"
            exit 1
          }
          & ./zig-out/bin/zghalint.exe --help | Out-Null

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p zghalint-${{ matrix.target }}
          cp zig-out/bin/zghalint zghalint-${{ matrix.target }}/zghalint
          cp LICENSE README.md zghalint-${{ matrix.target }}/
          tar -czf zghalint-${{ matrix.target }}.tar.gz zghalint-${{ matrix.target }}

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path zghalint-${{ matrix.target }} | Out-Null
          Copy-Item zig-out/bin/zghalint.exe zghalint-${{ matrix.target }}/zghalint.exe
          Copy-Item LICENSE, README.md zghalint-${{ matrix.target }}/
          Compress-Archive -Path zghalint-${{ matrix.target }} -DestinationPath zghalint-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zghalint-${{ matrix.target }}
          path: zghalint-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # リリース作成のためのアセットアップロード
      contents: write
      # SLSA provenance の署名 (Sigstore への OIDC トークン)
      id-token: write
      # 署名済み provenance をリポジトリの attestation として登録
      attestations: write
    timeout-minutes: 30
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum zghalint-* > SHA256SUMS

      # 配布アーカイブがこのリポジトリのこのワークフローで作られたことを
      # 検証可能にする。利用者は `gh attestation verify` で確認できる
      # (README「リリース成果物の検証」参照)。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/zghalint-*'

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-rc.*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG \
            artifacts/*

  # 公開後の E2E スモーク。action.yml のダウンロード手順 (アーカイブ取得 →
  # SHA256SUMS 照合 → 展開 → 実行) をそのままなぞり、公開されたアセットが
  # 利用者の手元で実際に動くことを確認する。`uses: watany-dev/zghalint@<tag>`
  # は ref にリテラルしか書けないため、同一ワークフロー内からは呼べない。
  smoke:
    name: Smoke published assets (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: macos-aarch64
            os: macos-latest
          - target: windows-x86_64
            os: windows-latest
    steps:
      - name: Download and run published asset (Unix)
        if: matrix.os != 'windows-latest'
        env:
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          ARCHIVE="zghalint-$TARGET.tar.gz"

          # リリース作成直後はアセットの配信が数秒遅れることがある。
          # SHA256SUMS も同じアセットなので同様にリトライする。
          fetch() {
            attempt=1
            while [ "$attempt" -le 5 ]; do
              if curl -fSL "$BASE_URL/$1" -o "$1"; then
                return 0
              fi
              attempt=$((attempt + 1))
              if [ "$attempt" -le 5 ]; then sleep 10; fi
            done
            echo "::error::failed to download $1"
            return 1
          }
          fetch "$ARCHIVE"
          fetch SHA256SUMS

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --ignore-missing -c SHA256SUMS
          else
            shasum -a 256 --ignore-missing -c SHA256SUMS
          fi

          tar -xzf "$ARCHIVE"
          BIN="zghalint-$TARGET/zghalint"
          chmod +x "$BIN"
          ACTUAL=$("$BIN" --version)
          echo "$ACTUAL"
          if [ "$ACTUAL" != "zghalint $TAG" ]; then
            echo "::error::published binary reports '$ACTUAL', expected 'zghalint $TAG'"
            exit 1
          fi
          "$BIN" --help > /dev/null

      - name: Download and run published asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $baseUrl = "https://github.com/$env:REPO/releases/download/$tag"
          $archive = "zghalint-$env:TARGET.zip"

          # リリース作成直後はアセットの配信が数秒遅れることがある。
          # SHA256SUMS も同じアセットなので同様にリトライする。
          function Get-Asset($name) {
            foreach ($attempt in 1..5) {
              try {
                Invoke-WebRequest -Uri "$baseUrl/$name" -OutFile $name
                return
              } catch {
                if ($attempt -eq 5) { throw }
                Start-Sleep -Seconds 10
              }
            }
          }
          Get-Asset $archive
          Get-Asset 'SHA256SUMS'

          $expected = (Select-String -Path SHA256SUMS -Pattern ([regex]::Escape($archive)) |
            Select-Object -First 1).Line.Split(' ')[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          if ($actualHash -ne $expected) {
            Write-Output "::error::checksum mismatch for $archive"
            exit 1
          }

          Expand-Archive -Path $archive -DestinationPath .
          $bin = "zghalint-$env:TARGET/zghalint.exe"
          $actual = & $bin --version
          Write-Host $actual
          if ($actual -ne "zghalint $tag") {
            Write-Output "::error::published binary reports '$actual', expected 'zghalint $tag'"
            exit 1
          }
          & $bin --help | Out-Null
