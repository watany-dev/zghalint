name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# リリースは途中でキャンセルすると中途半端な成果物が残るため、
# グループ化だけ行い cancel-in-progress は付けない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # このワークフローが公開する成果物は、プルリクエストが汚染しうる
          # キャッシュから出てきてはならない (zizmor: cache-poisoning)。
          use-cache: false

      - name: Build
        run: zig build

      # タグ・build.zig.zon・action.yml・README・バイナリの --version が
      # 食い違ったままリリースされるのを防ぐ。タグと突き合わせられるのは
      # このワークフローだけなので、CI の同名チェック (引数なし) より厳しい。
      - name: Verify version consistency
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG#v}

          ./scripts/check-version-sync.sh "$TAG"

          # build.zig 経由のバージョン伝播はビルド済みバイナリでしか見えない。
          # 出力は `zghalint vX.Y.Z` 形式なので、先頭の `v` を落として比較する。
          BIN_VERSION=$(./zig-out/bin/zghalint --version | tr -d '\r' | awk '{print $NF}')
          BIN_VERSION=${BIN_VERSION#v}
          if [ "$BIN_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::binary reports --version $BIN_VERSION but tag implies $TAG_VERSION"
            exit 1
          fi
          echo "version OK: $TAG_VERSION"

      - name: Format Check
        run: zig fmt --check src/ build.zig

      - name: Test
        run: zig build test --summary all

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        # ci.yml の cross ジョブが同じ zig_target を PR 時に検証している。
        # ターゲットを増減するときは両方を併せて更新すること。
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            zig_target: x86_64-linux
            native: true
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            zig_target: aarch64-linux
            native: true
          # macOS は macos-15 に固定する。macos-latest が載せる新しい SDK では
          # Zig 0.15.2 のリンカが libSystem のシンボルを解決できずビルドが落ちる
          # （詳細は ci.yml の build ジョブのコメント）。Zig 側が対応したら
          # ci.yml と併せて macos-latest に戻す。
          #
          # macOS ランナーは arm64 であり、x86_64 バイナリの実行には Rosetta が
          # 要る。存在は保証されないため起動テストの対象外とする。
          - target: macos-x86_64
            os: macos-15
            zig_target: x86_64-macos
            native: false
          - target: macos-aarch64
            os: macos-15
            zig_target: aarch64-macos
            native: true
          - target: windows-x86_64
            os: windows-latest
            zig_target: x86_64-windows
            native: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # version を省略すると build.zig.zon の minimum_zig_version が使われる。
      # Zig バージョンの定義箇所は build.zig.zon 一箇所に集約する。
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # このワークフローが公開する成果物は、プルリクエストが汚染しうる
          # キャッシュから出てきてはならない (zizmor: cache-poisoning)。
          use-cache: false

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}

      # 起動すらしないバイナリを公開しないための最低限の確認。`--version` は
      # タグと一致していなければならない (build.zig.zon の version 更新漏れ検知)。
      - name: Smoke test binary (Unix)
        if: matrix.native && matrix.os != 'windows-latest'
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ACTUAL=$(./zig-out/bin/zghalint --version)
          echo "$ACTUAL"
          if [ "$ACTUAL" != "zghalint $TAG" ]; then
            echo "::error::--version returned '$ACTUAL', expected 'zghalint $TAG'"
            exit 1
          fi
          ./zig-out/bin/zghalint --help > /dev/null

      - name: Smoke test binary (Windows)
        if: matrix.native && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $actual = & ./zig-out/bin/zghalint.exe --version
          Write-Host $actual
          if ($actual -ne "zghalint $tag") {
            Write-Output "::error::--version returned '$actual', expected 'zghalint $tag'"
            exit 1
          }
          & ./zig-out/bin/zghalint.exe --help | Out-Null

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p zghalint-${{ matrix.target }}
          cp zig-out/bin/zghalint zghalint-${{ matrix.target }}/zghalint
          cp LICENSE README.md zghalint-${{ matrix.target }}/
          tar -czf zghalint-${{ matrix.target }}.tar.gz zghalint-${{ matrix.target }}

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path zghalint-${{ matrix.target }} | Out-Null
          Copy-Item zig-out/bin/zghalint.exe zghalint-${{ matrix.target }}/zghalint.exe
          Copy-Item LICENSE, README.md zghalint-${{ matrix.target }}/
          Compress-Archive -Path zghalint-${{ matrix.target }} -DestinationPath zghalint-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zghalint-${{ matrix.target }}
          path: zghalint-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # リリース作成のためのアセットアップロード
      contents: write
      # SLSA provenance の署名 (Sigstore への OIDC トークン)
      id-token: write
      # 署名済み provenance をリポジトリの attestation として登録
      attestations: write
    timeout-minutes: 30
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum zghalint-* > SHA256SUMS

      # 配布アーカイブがこのリポジトリのこのワークフローで作られたことを
      # 検証可能にする。利用者は `gh attestation verify` で確認できる
      # (README「リリース成果物の検証」参照)。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/zghalint-*'

      # タグに Release が既にあると `gh release create` は失敗し、アセットが
      # 1 つも付かない Release が残る。`uses: watany-dev/zghalint@<tag>` は
      # アセットを取りに行くので、それは利用者から見て壊れている (#372)。
      # 既存なら upload に倒し、再実行でも必ずアセットが揃うようにする。
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PRERELEASE=false
          case "$TAG" in
            *-rc.*) PRERELEASE=true ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --prerelease="$PRERELEASE"
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --prerelease="$PRERELEASE" \
              artifacts/*
          fi

  # 公開後の E2E スモーク。action.yml のダウンロード手順 (アーカイブ取得 →
  # SHA256SUMS 照合 → 展開 → 実行) をそのままなぞり、公開されたアセットが
  # 利用者の手元で実際に動くことを確認する。`uses: watany-dev/zghalint@<tag>`
  # は ref にリテラルしか書けないため、同一ワークフロー内からは呼べない。
  smoke:
    name: Smoke published assets (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: macos-aarch64
            os: macos-latest
          - target: windows-x86_64
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and run published asset (Unix)
        if: matrix.os != 'windows-latest'
        env:
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          ARCHIVE="zghalint-$TARGET.tar.gz"

          # リリース作成直後はアセットの配信が数秒遅れることがある。
          # SHA256SUMS も同じアセットなので同様にリトライする。
          fetch() {
            attempt=1
            while [ "$attempt" -le 5 ]; do
              if curl -fSL "$BASE_URL/$1" -o "$1"; then
                return 0
              fi
              attempt=$((attempt + 1))
              if [ "$attempt" -le 5 ]; then sleep 10; fi
            done
            echo "::error::failed to download $1"
            return 1
          }
          fetch "$ARCHIVE"
          fetch SHA256SUMS

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --ignore-missing -c SHA256SUMS
          else
            shasum -a 256 --ignore-missing -c SHA256SUMS
          fi

          tar -xzf "$ARCHIVE"
          BIN="zghalint-$TARGET/zghalint"
          chmod +x "$BIN"
          ACTUAL=$("$BIN" --version)
          echo "$ACTUAL"
          if [ "$ACTUAL" != "zghalint $TAG" ]; then
            echo "::error::published binary reports '$ACTUAL', expected 'zghalint $TAG'"
            exit 1
          fi
          "$BIN" --help > /dev/null

      - name: Download and run published asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $baseUrl = "https://github.com/$env:REPO/releases/download/$tag"
          $archive = "zghalint-$env:TARGET.zip"

          # リリース作成直後はアセットの配信が数秒遅れることがある。
          # SHA256SUMS も同じアセットなので同様にリトライする。
          function Get-Asset($name) {
            foreach ($attempt in 1..5) {
              try {
                Invoke-WebRequest -Uri "$baseUrl/$name" -OutFile $name
                return
              } catch {
                if ($attempt -eq 5) { throw }
                Start-Sleep -Seconds 10
              }
            }
          }
          Get-Asset $archive
          Get-Asset 'SHA256SUMS'

          $expected = (Select-String -Path SHA256SUMS -Pattern ([regex]::Escape($archive)) |
            Select-Object -First 1).Line.Split(' ')[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          if ($actualHash -ne $expected) {
            Write-Output "::error::checksum mismatch for $archive"
            exit 1
          }

          Expand-Archive -Path $archive -DestinationPath .
          $bin = "zghalint-$env:TARGET/zghalint.exe"
          $actual = & $bin --version
          Write-Host $actual
          if ($actual -ne "zghalint $tag") {
            Write-Output "::error::published binary reports '$actual', expected 'zghalint $tag'"
            exit 1
          }
          & $bin --help | Out-Null

      # `curl | sh` の経路。install.sh はチェックアウトしたものを使う: raw.
      # githubusercontent 越しに取ると、まだ main に入っていない修正が
      # 検証されないまま公開されてしまう。install.sh は Windows を扱わない
      # (リリースページと action を案内して終了する) ので Unix だけで回す。
      - name: Install via install.sh (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          PREFIX="$RUNNER_TEMP/zghalint-install"
          ./install.sh --version "$TAG" --prefix "$PREFIX"
          ACTUAL=$("$PREFIX/bin/zghalint" --version)
          if [ "$ACTUAL" != "zghalint $TAG" ]; then
            echo "::error::install.sh installed '$ACTUAL', expected 'zghalint $TAG'"
            exit 1
          fi

  # Homebrew tap (watany-dev/homebrew-tap) の formula を、公開された
  # SHA256SUMS から生成して置き換える。tap は別リポジトリなので
  # GITHUB_TOKEN では書けず、`contents: write` を持つ PAT
  # (secret: HOMEBREW_TAP_TOKEN) が要る。手順は docs/maintenance.md。
  homebrew:
    name: Update Homebrew tap
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      TAP_REPO: watany-dev/homebrew-tap
      FORMULA_PATH: Formula/zghalint.rb
    steps:
      # プレリリース (`-rc.`) は tap へ流さない。`brew install zghalint` した
      # 利用者に検証中のビルドが降りてくるのを避ける。判定を式ではなく
      # シェルで書くのは、release ジョブの --prerelease 判定と同じ規則を
      # 同じ形で持つため (docs/maintenance.md のタグ命名規則)。
      - name: Decide whether this tag goes to the tap
        id: gate
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          case "$TAG" in
            *-rc.*)
              echo "::notice::$TAG is a prerelease; leaving the tap untouched"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 公開済みのチェックサムをそのまま使う。ここで作り直すと、formula が
      # 利用者のダウンロードするアーカイブと別物を指しうる。
      - name: Fetch published checksums
        if: steps.gate.outputs.publish == 'true'
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          URL="https://github.com/$REPO/releases/download/$TAG/SHA256SUMS"
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if curl -fSL "$URL" -o SHA256SUMS; then
              exit 0
            fi
            attempt=$((attempt + 1))
            if [ "$attempt" -le 5 ]; then sleep 10; fi
          done
          echo "::error::failed to download $URL"
          exit 1

      - name: Generate formula
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          ./scripts/gen-homebrew-formula.sh "$TAG" SHA256SUMS > zghalint.rb
          cat zghalint.rb

      # tap へは Contents API で 1 コミット。チェックアウトして push すると
      # 認証情報がワークスペースに残る (SEC015 / zizmor: artipacked)。
      - name: Publish formula to the tap
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the tap update"
            exit 0
          fi
          TAG=${GITHUB_REF#refs/tags/}

          # 上書きには現在の blob sha が要る。初回はファイルが無いので空。
          CURRENT_SHA=$(gh api "repos/$TAP_REPO/contents/$FORMULA_PATH" --jq .sha 2>/dev/null || true)
          SHA_ARGS=()
          if [ -n "$CURRENT_SHA" ]; then
            SHA_ARGS=(-f "sha=$CURRENT_SHA")
          fi

          gh api --method PUT "repos/$TAP_REPO/contents/$FORMULA_PATH" \
            -f "message=zghalint $TAG" \
            -f "content=$(base64 -w0 zghalint.rb)" \
            "${SHA_ARGS[@]}" > /dev/null
          echo "updated $TAP_REPO/$FORMULA_PATH to $TAG"
