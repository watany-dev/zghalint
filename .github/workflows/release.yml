name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
            zig_target: x86_64-linux
          - target: aarch64-linux
            os: ubuntu-latest
            zig_target: aarch64-linux
          - target: x86_64-macos
            os: macos-latest
            zig_target: x86_64-macos
          - target: aarch64-macos
            os: macos-latest
            zig_target: aarch64-macos
          - target: x86_64-windows
            os: windows-latest
            zig_target: x86_64-windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: mlugg/setup-zig@a45da26e596797833bbed34ebfde3c291b18e02e # v2.0.1
        with:
          version: 0.14.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: mv zig-out/bin/zghalint zghalint-${{ matrix.target }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: mv zig-out/bin/zghalint.exe zghalint-${{ matrix.target }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zghalint-${{ matrix.target }}
          path: zghalint-${{ matrix.target }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum zghalint-* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            artifacts/*
