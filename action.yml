name: 'zghalint'
description: 'Fast, comprehensive GitHub Actions workflow linter'
inputs:
  paths:
    description: 'Glob pattern for workflow files'
    default: '.github/workflows/*.yml'
  config:
    description: 'Path to config file'
    default: '.zghalint.yml'
  format:
    description: 'Output format (terminal, json, sarif)'
    default: 'terminal'
  offline:
    description: 'Disable network requests and use only local data/cache'
    default: 'false'
  fix:
    description: 'Fix mode: none, safe, unsafe'
    default: ''
branding:
  icon: 'check-circle'
  color: 'green'
runs:
  using: 'composite'
  steps:
    - name: Download zghalint
      shell: bash
      run: |
        VERSION=${GITHUB_ACTION_REF:-v0.0.1-rc.1}

        case "$RUNNER_OS" in
          Linux)  OS=linux ;;
          macOS)  OS=macos ;;
          Windows) OS=windows ;;
          *) echo "::error::Unsupported OS: $RUNNER_OS"; exit 1 ;;
        esac

        case "$RUNNER_ARCH" in
          X64)   ARCH=x86_64 ;;
          ARM64) ARCH=aarch64 ;;
          *) echo "::error::Unsupported architecture: $RUNNER_ARCH"; exit 1 ;;
        esac

        if [ "$OS" = "windows" ] && [ "$ARCH" = "aarch64" ]; then
          echo "::error::Windows ARM64 is not supported"; exit 1
        fi

        if [ "$OS" = "windows" ]; then
          ARCHIVE="zghalint-$OS-$ARCH.zip"
          curl -fSL "https://github.com/watany-dev/zghalint/releases/download/$VERSION/$ARCHIVE" -o "$ARCHIVE"
          unzip -q "$ARCHIVE"
          cp "zghalint-$OS-$ARCH/zghalint.exe" ./zghalint.exe
        else
          ARCHIVE="zghalint-$OS-$ARCH.tar.gz"
          curl -fSL "https://github.com/watany-dev/zghalint/releases/download/$VERSION/$ARCHIVE" -o "$ARCHIVE"
          tar -xzf "$ARCHIVE"
          cp "zghalint-$OS-$ARCH/zghalint" ./zghalint
          chmod +x ./zghalint
        fi
    - name: Run zghalint
      shell: bash
      run: |
        FIX_FLAG=""
        OFFLINE_FLAG=""
        if [ "${{ inputs.fix }}" = "safe" ]; then
          FIX_FLAG="--fix"
        elif [ "${{ inputs.fix }}" = "unsafe" ]; then
          FIX_FLAG="--fix-unsafe"
        fi

        if [ "${{ inputs.offline }}" = "true" ]; then
          OFFLINE_FLAG="--offline"
        fi

        if [ "$RUNNER_OS" = "Windows" ]; then
          ./zghalint.exe ${{ inputs.paths }} --config ${{ inputs.config }} --format ${{ inputs.format }} $OFFLINE_FLAG $FIX_FLAG
        else
          ./zghalint ${{ inputs.paths }} --config ${{ inputs.config }} --format ${{ inputs.format }} $OFFLINE_FLAG $FIX_FLAG
        fi
