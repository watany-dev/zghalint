name: 'zghalint'
description: 'Fast, comprehensive GitHub Actions workflow linter'
inputs:
  paths:
    description: 'Glob pattern for workflow files'
    default: '.github/workflows/*.yml'
  config:
    description: 'Path to config file'
    default: '.zghalint.yml'
  format:
    description: 'Output format (terminal, json, sarif)'
    default: 'terminal'
branding:
  icon: 'check-circle'
  color: 'green'
runs:
  using: 'composite'
  steps:
    - name: Download zghalint
      shell: bash
      run: |
        VERSION=${GITHUB_ACTION_REF:-v0.1.0}
        OS=linux; ARCH=x86_64
        curl -L https://github.com/watany-dev/zghalint/releases/download/$VERSION/zghalint-$OS-$ARCH -o zghalint
        chmod +x zghalint
    - name: Run zghalint
      shell: bash
      run: ./zghalint ${{ inputs.paths }} --config ${{ inputs.config }} --format ${{ inputs.format }}
