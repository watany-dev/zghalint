name: 'zghalint'
description: 'Fast, comprehensive GitHub Actions workflow linter'
inputs:
  paths:
    description: 'Glob pattern for workflow files'
    default: '.github/workflows/*.yml'
  config:
    description: 'Path to config file'
    default: '.zghalint.yml'
  format:
    description: 'Output format (terminal, json, sarif)'
    default: 'terminal'
  offline:
    description: 'Disable network requests and use only local data/cache'
    default: 'false'
  fix:
    description: 'Fix mode: none, safe, unsafe'
    default: ''
  version:
    description: >-
      Release tag to download (for example `v0.1.0`). When empty, the version
      is derived from the ref this action was referenced by; a ref that is not
      a release tag (a commit SHA, a moving major tag, a branch) falls back to
      the release this commit belongs to, which only exists once that release
      is tagged.
    default: ''
  binary:
    description: >-
      Path to a prebuilt zghalint binary. When set, the release download and
      checksum verification are skipped and this binary is run as-is. Intended
      for this repository's own CI, which must exercise the action against the
      commit under test rather than a published release.
    default: ''
branding:
  icon: 'check-circle'
  color: 'green'
runs:
  using: 'composite'
  steps:
    - name: Download zghalint
      shell: bash
      env:
        INPUT_BINARY: ${{ inputs.binary }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$INPUT_BINARY" ]; then
          echo "Using prebuilt binary: $INPUT_BINARY"
          exit 0
        fi

        # The release this commit belongs to. Kept in sync with
        # `build.zig.zon`'s `.version` by CI (see docs/maintenance.md).
        FALLBACK_VERSION=v0.0.1

        # $GITHUB_ACTION_REF is whatever the caller wrote after `@`, and only a
        # release tag names a downloadable archive. A SHA (what SEC001 asks
        # users to pin), a moving major tag and a branch all still identify
        # this commit, so they resolve to the release it belongs to.
        VERSION="$INPUT_VERSION"
        if [ -z "$VERSION" ]; then
          case "${GITHUB_ACTION_REF:-}" in
            v[0-9]*.[0-9]*.[0-9]*) VERSION="$GITHUB_ACTION_REF" ;;
            *) VERSION="$FALLBACK_VERSION" ;;
          esac
        fi
        echo "Downloading zghalint $VERSION"

        case "$RUNNER_OS" in
          Linux)  OS=linux ;;
          macOS)  OS=macos ;;
          Windows) OS=windows ;;
          *) echo "::error::Unsupported OS: $RUNNER_OS"; exit 1 ;;
        esac

        case "$RUNNER_ARCH" in
          X64)   ARCH=x86_64 ;;
          ARM64) ARCH=aarch64 ;;
          *) echo "::error::Unsupported architecture: $RUNNER_ARCH"; exit 1 ;;
        esac

        if [ "$OS" = "windows" ] && [ "$ARCH" = "aarch64" ]; then
          echo "::error::Windows ARM64 is not supported"; exit 1
        fi

        if [ "$OS" = "windows" ]; then
          ARCHIVE="zghalint-$OS-$ARCH.zip"
        else
          ARCHIVE="zghalint-$OS-$ARCH.tar.gz"
        fi

        BASE_URL="https://github.com/watany-dev/zghalint/releases/download/$VERSION"
        curl -fSL "$BASE_URL/$ARCHIVE" -o "$ARCHIVE"
        curl -fSL "$BASE_URL/SHA256SUMS" -o SHA256SUMS

        # Verify the archive against the checksums published with the release
        # so a tampered or truncated download is rejected before extraction.
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum --ignore-missing -c SHA256SUMS
        else
          shasum -a 256 --ignore-missing -c SHA256SUMS
        fi

        if [ "$OS" = "windows" ]; then
          unzip -q "$ARCHIVE"
          cp "zghalint-$OS-$ARCH/zghalint.exe" ./zghalint.exe
        else
          tar -xzf "$ARCHIVE"
          cp "zghalint-$OS-$ARCH/zghalint" ./zghalint
          chmod +x ./zghalint
        fi
    - name: Run zghalint
      shell: bash
      # Inputs are passed through the environment instead of being expanded
      # inside the script; a `${{ }}` expansion in `run:` is a shell
      # injection vector when the caller derives an input from event data.
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_FIX: ${{ inputs.fix }}
        INPUT_BINARY: ${{ inputs.binary }}
      run: |
        FIX_FLAG=""
        OFFLINE_FLAG=""
        case "$INPUT_FIX" in
          safe)   FIX_FLAG="--fix" ;;
          unsafe) FIX_FLAG="--fix-unsafe" ;;
        esac

        if [ "$INPUT_OFFLINE" = "true" ]; then
          OFFLINE_FLAG="--offline"
        fi

        EXE=""
        if [ "$RUNNER_OS" = "Windows" ]; then
          EXE=".exe"
        fi

        BIN="${INPUT_BINARY:-./zghalint$EXE}"

        # The default config path is optional; only a config that exists is
        # passed, since a missing explicit --config is an error.
        CONFIG_ARGS=()
        if [ -f "$INPUT_CONFIG" ]; then
          CONFIG_ARGS=(--config "$INPUT_CONFIG")
        fi

        # $INPUT_PATHS is intentionally unquoted: it is a glob that the shell
        # expands. nullglob drops a pattern that matches nothing (a repository
        # with only `.yaml` workflows) instead of passing the literal glob as a
        # missing file. `--` keeps a path that begins with `-` from being read
        # as an option.
        shopt -s nullglob
        # shellcheck disable=SC2086
        "$BIN" "${CONFIG_ARGS[@]}" --format "$INPUT_FORMAT" $OFFLINE_FLAG $FIX_FLAG -- $INPUT_PATHS
