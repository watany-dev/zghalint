[tool.pytest.ini_options]
testpaths = ["tests/pbt"]
pythonpath = ["."]

[tool.ruff]
# scripts/formal/ imports its siblings by bare name (it runs as a script), so
# that directory is a source root too — otherwise isort files them as third-party.
src = [".", "scripts/formal"]
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, flake8-comprehensions.
select = ["E", "F", "I", "UP", "B", "C4"]
