# zghalint:expect SEC022@14
# #220 repro: the anchor has to hold on every path that reaches the job. Joined
# with `||` the branch gate stands on its own, so the first job is reported.
# The second job excludes the fork runs through a negation and must stay quiet.
name: sec022 workflow run anchor paths
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  bypassable-deploy:
    if: github.event.workflow_run.head_repository.full_name == github.repository || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy
        run: ./deploy.sh
  negated-exclusion-deploy:
    if: ${{ !(github.event.workflow_run.head_repository.fork == true || github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy
        run: ./deploy.sh
