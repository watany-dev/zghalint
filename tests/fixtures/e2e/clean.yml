# A well-formed workflow: the linter must stay quiet on all of these rules.
# zghalint:forbid SEC001 SEC002 SEC003 SEC004 SEC006 SEC007 SEC018
# zghalint:forbid SC001 SC002 EXPR001 EXPR002 BP001 BP002 BP005
# zghalint:forbid PERF001 PERF002 PERM001 RUNNER001 BP004
# zghalint:forbid SYN001 SYN002 SYN003 SYN004 SYN005 SYN006 SYN007 SYN008
name: clean
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show the ref
        run: echo "ref is ${{ github.ref }}"
