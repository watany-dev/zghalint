# zghalint:forbid SEC013
# GHCR login uses github.actor, not secrets.*, so treating it as plaintext is an FP.
name: ghcr credentials
on:
  push:
    branches: [main]
concurrency:
  group: sec013-ghcr
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
jobs:
  eval:
    name: Eval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/example/app@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Run
        run: echo ok
