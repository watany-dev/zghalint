# zghalint:expect SYN008@30 SYN008@38
# zghalint:forbid SYN008@44
name: duplicate needs
on: [push]
concurrency: ci
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build
        run: echo build
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test
        run: echo test
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build
      - test
      - build
    steps:
      - name: Package
        run: echo package
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, build]
    steps:
      - name: Publish
        run: echo publish
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, test]
    steps:
      - name: Deploy
        run: echo deploy
