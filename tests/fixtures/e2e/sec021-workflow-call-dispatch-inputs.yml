# zghalint:expect SEC021@28
# #219: `workflow_call` alongside `workflow_dispatch` used to mark `inputs.ref`
# as a caller-supplied value and drop it from the rule. The same input is still
# whatever the dispatching user types, so it stays untrusted. The second job
# pins the ref the repository controls and must stay quiet.
name: sec021 workflow_call alongside workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      ref:
        description: ref to build
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        type: string
permissions:
  contents: read
jobs:
  build-requested-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
  build-default-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
