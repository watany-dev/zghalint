# zghalint:expect SYN001 SYN009 SYN010 SYN016 SYN019
# zghalint:expect PERM003 DEP005 EXPR010 EXPR011
# #323: every did-you-mean suggestion below is also an autofix; the applied
# result is pinned by `rename-fix-schema.yml.fixed`.
name: rename fix
run-nam: rename
on:
  pusg:
    branches: [main]
  pull_request:
    types: [opend]
  schedule:
    - cron: "0 0 * * *"
      timezone: Asia/Tokio
    - cron: "30 1 * * *"
      timezone: 'Europe/Berln'
permissions:
  content: read
  actions: read
concurrency: rename-fix
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest]
        exclude:
          - oss: ubuntu-latest
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-dept: 1
      - name: report
        run: echo "${{ steps.chekout.outputs.ref }} ${{ matrix.oss }}"
