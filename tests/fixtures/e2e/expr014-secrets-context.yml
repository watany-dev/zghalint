# zghalint:expect EXPR014@18 EXPR014@20
name: secrets context
on:
  workflow_call:
    secrets:
      npm_token:
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Misspelled secret
        run: echo "${{ secrets.npm_tokne }}"
      - name: Undeclared secret
        run: echo "${{ secrets.AWS_KEY }}"
      - name: Declared secret and the builtin token
        run: echo "${{ secrets.npm_token }} ${{ secrets.GITHUB_TOKEN }}"
