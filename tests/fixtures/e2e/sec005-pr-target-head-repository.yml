# zghalint:expect SEC005@20
# zghalint:forbid SEC021
# #218: `with.repository` decides which repository is checked out just as much
# as `with.ref` does, so a `pull_request_target` job pointed at the PR head
# repository runs fork code with the base repository's token. The second job
# names the base repository and must stay quiet.
name: sec005 pull_request_target head repository
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  build-head-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the PR head repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
  build-base-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the base repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          persist-credentials: false
