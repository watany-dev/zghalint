# zghalint:expect SEC021@16 SEC021@25
# #143 repro: a `workflow_run` job gated on `head_branch` is not gated at all —
# a fork only has to name its branch `main`. The `head_repository` check below
# is the real gate, so the `head_branch` comparison next to it stays quiet.
name: sec021 workflow_run gate
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Deploy
        run: ./deploy.sh
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release notice
        if: contains(github.event.workflow_run.display_title, 'release')
        run: echo notify
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Publish
        run: ./publish.sh
