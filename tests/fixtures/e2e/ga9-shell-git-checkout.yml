# zghalint:expect SEC002 SEC001 SEC005
# A shell `git checkout` of PR head is the same untrusted fetch as
# `actions/checkout` `with.ref`; checkout v7's gate does not cover it (#532).
name: ga9 shell git checkout
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git checkout ${{ github.head_ref }}
