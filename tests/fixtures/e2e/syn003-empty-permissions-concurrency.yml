# zghalint:expect SYN003 BP002@18
# zghalint:forbid SEC007 BP005 PERM002
# #364: an empty `permissions:` / `concurrency:` is a diagnostic, not a parse
# failure that swallows every other finding in the file. The sections are
# written, so the rules that insert a missing one stay quiet instead of
# producing a duplicate key.
name: empty sections
on: push
permissions:
concurrency:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
    concurrency:
    steps:
      - run: echo ok
      - name: Third-party action
        uses: someorg/some-action@0000000000000000000000000000000000000000 # v1
