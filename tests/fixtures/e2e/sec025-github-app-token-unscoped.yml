# zghalint:expect SEC025@18
# owner / repositories narrow the installation, not its permission set.
name: labeler
on:
  issues:
    types: [opened]
concurrency:
  group: labeler-${{ github.ref }}
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint a token
        id: mint
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
