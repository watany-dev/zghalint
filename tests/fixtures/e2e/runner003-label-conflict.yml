# zghalint:expect RUNNER003@9 RUNNER003@14
# zghalint:forbid RUNNER003@19 RUNNER003@24 RUNNER003@29 RUNNER003@34
# zghalint:forbid RUNNER002@34 RUNNER002@19
name: runner label conflict
on: push
jobs:
  two-hosted-os:
    # ubuntu-latest and windows-latest can never be the same runner
    runs-on: [ubuntu-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - run: echo hi
  self-hosted-across-os:
    runs-on: [self-hosted, linux, macos-14]
    timeout-minutes: 5
    steps:
      - run: echo hi
  self-hosted-fleet:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - run: echo hi
  single-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo hi
  matrix-expression:
    runs-on: [ubuntu-latest, windows-latest, "${{ matrix.os }}"]
    timeout-minutes: 5
    steps:
      - run: echo hi
  fleet-named-after-an-os:
    # `macos-m1` is this fleet's own machine name, not GitHub's macOS image
    runs-on: [self-hosted, linux, macos-m1]
    timeout-minutes: 5
    steps:
      - run: echo hi
