# bench:expect needs-unknown-job@14
name: needs names a job that does not exist
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build
        run: make build
  deploy:
    needs: [buld]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy
        run: make deploy
