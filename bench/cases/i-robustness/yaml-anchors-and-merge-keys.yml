# bench:expect missing-timeout@24
# bench:forbid unknown-key
# bench:forbid mapping-value-type
# actionlint 1.7.10 以降は alias を解決する。merge key `<<:` の拒否は GA12 (#439)。
name: workflow built out of anchors, aliases and a merge key
on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults: &defaults
  run:
    shell: bash
jobs:
  build:
    defaults: *defaults
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build
        run: make build
  test:
    defaults: *defaults
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: make test
