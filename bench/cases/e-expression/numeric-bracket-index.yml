# Numeric index into a context array is valid expression syntax.
# bench:forbid expression-syntax
name: build
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record the triggering pull request number
        run: echo "${{ github.event.workflow_run.pull_requests[0].number }}"
