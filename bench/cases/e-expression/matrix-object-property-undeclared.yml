# bench:expect undeclared-matrix-key@20
name: build
on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu
            arch: x64
    steps:
      - name: Build
        run: echo "${{ matrix.platform.image }}"
