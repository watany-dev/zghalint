# bench:forbid undeclared-matrix-key
# G27: the matrix comes from a previous job's output, so its key set is not
# knowable statically. EXPR011 reports `matrix.runner` as undeclared anyway.
name: dynamic matrix
on: push
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build the matrix
        id: set
        run: echo 'matrix=[{"runner":"ubuntu"}]' >> "$GITHUB_OUTPUT"
  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Test
        run: echo "on ${{ matrix.runner }}"
