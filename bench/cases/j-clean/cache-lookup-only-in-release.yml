# bench:forbid cache-poisoning
name: release
on:
  push:
    tags: ["v*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the cache without restoring it
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache
          key: build-${{ hashFiles('**/lock') }}
          lookup-only: true
      - name: Build
        run: make
