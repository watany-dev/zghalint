# bench:forbid undeclared-matrix-key
# bench:forbid matrix-include-exclude
# bench:forbid expression-syntax
name: a matrix whose keys all come from include entries
on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
        exclude:
          - os: windows-latest
            node: 20
        include:
          - os: ubuntu-latest
            node: 22
            coverage: true
    steps:
      - name: Test
        run: echo "node ${{ matrix.node }} coverage ${{ matrix.coverage }}"
