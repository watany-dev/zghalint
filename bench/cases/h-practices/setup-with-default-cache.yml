# bench:forbid missing-cache
name: setup actions that cache by default need no cache input
on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Zig
        uses: mlugg/setup-zig@a67e68dc5c8281d9608136d3d7ca1b282213e4ac
        with:
          version: 0.15.2
      - name: Set up uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
      - name: Build
        run: zig build
