# bench:expect deprecated-workflow-command@16
name: step using the retired set-output command
on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Emit a value
        id: emit
        run: echo "::set-output name=tag::v1"
      - name: Use it
        run: echo "${{ steps.emit.outputs.tag }}"
