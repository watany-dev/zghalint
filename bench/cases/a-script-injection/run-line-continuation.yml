# `\` 継続をまたぐ二重引用符スカラー。#173 の位置ズレ再発防止。
# bench:expect template-injection@15
name: line continuation
on:
  issues:
    types: [opened]
permissions: {}
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Echo the title over a continuation
        run: "echo one && \
          echo ${{ github.event.issue.title }}"
