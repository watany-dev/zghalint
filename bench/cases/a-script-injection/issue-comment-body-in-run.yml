# bench:expect template-injection@15
# bench:expect untrusted-checkout@19
# bench:forbid expression-syntax
name: comment triage
on:
  issue_comment:
    types: [created]
permissions: {}
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Echo the comment
        run: echo "${{ github.event.comment.body }}"
      - name: Check out the requested ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.comment.body }}
          persist-credentials: false
