# bench:expect untrusted-checkout@16
name: discussion comment ref
on:
  discussion_comment:
    types: [created]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the ref named in the comment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.comment.body }}
          persist-credentials: false
