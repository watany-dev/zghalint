# fork が自分で決めるブランチ名でゲートしている。zghalint 固有 (SEC022)。
# bench:expect branch-gate@13 zghalint=SEC022 zizmor=- actionlint=-
# bench:expect dangerous-trigger@5
name: workflow_run branch gate
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
jobs:
  publish:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish
        run: make publish
