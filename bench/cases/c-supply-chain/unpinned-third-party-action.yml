# bench:expect unpinned-action@13
# bench:expect missing-cache@15
# missing-cache は PERF001 固有。zizmor/actionlint に対応する監査はなく unique-win になる。
name: build
on: push
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: '3.12'
