# 2025-03 に侵害された tj-actions/changed-files のコミット。埋め込みデータで
# 判定するため --offline でも出る。
# bench:expect compromised-action@14 zghalint=SC002 zizmor=- actionlint=-
name: compromised sha
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List changed files
        uses: tj-actions/changed-files@0e58ed8671d6b60d0890c21b07f8835ace038e67
