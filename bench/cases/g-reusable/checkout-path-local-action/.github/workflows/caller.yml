# bench:forbid local-action-inputs
# bench:forbid unpinned-action
# bench:forbid missing-timeout
# #305: the action under test is checked out into `action-under-test/` at run
# time, so neither linter may complain that the directory is missing.
name: run the action under test from a checkout path
on: push
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the action out beside the workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: action-under-test
          persist-credentials: false
      - name: Run the action under test
        uses: ./action-under-test
