# `toJSON(secrets)` は個々のマスクを迂回して全シークレットをログへ流す。
# bench:expect overprovisioned-secrets@15
name: toJSON secrets
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump the secrets context
        run: echo "$ALL"
        env:
          ALL: ${{ toJSON(secrets) }}
