\* Base configuration: properties that are expected to HOLD.
\* The expected-to-fail invariants live in FixEngine_atomic.cfg,
\* FixEngine_order.cfg and FixEngine_order_noinsert.cfg.
CONSTANTS
    N = 2
    MaxFixes = 2
    MaxEditsPerFix = 2
SPECIFICATION Spec
INVARIANTS
    NoUnderflow
    KeptDisjoint
    LoopMatchesSpec
    InsertionsCoexist
